<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · LOCQO</title>
  <meta name="description" content="Sign in to LOCQO, the K.R. Mangalam University campus navigator.">
  <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12171e" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z' fill='%2317202b'/%3E%3Ccircle cx='12' cy='9' r='2.6' fill='%23c8a24a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">
      <svg class="pin" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7z"
              fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="9" r="2.4" fill="var(--gold)"/>
      </svg>
      <span class="wordmark" translate="no">LOC<span class="q">Q</span>O</span>
    </h1>
    <p class="tagline">Find. Navigate. Explore.</p>
  </header>

  <main class="auth">
    <div class="panel">
      <div class="tabs" role="tablist" aria-label="Sign in or create an account">
        <button type="button" id="tab-signin" class="tab is-on" role="tab" aria-selected="true"
                aria-controls="signin">Sign in</button>
        <button type="button" id="tab-signup" class="tab" role="tab" aria-selected="false"
                aria-controls="signup">Create account</button>
      </div>

      <form id="signin" class="auth-form" role="tabpanel" aria-labelledby="tab-signin" novalidate>
        <label class="field">
          <span class="field-label">Username</span>
          <input id="si-user" name="username" autocomplete="username" required
                 autocapitalize="none" spellcheck="false" enterkeyhint="go">
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input id="si-pass" name="password" type="password" autocomplete="current-password"
                 required enterkeyhint="go">
        </label>
        <button type="submit" class="go">Sign in</button>
      </form>

      <form id="signup" class="auth-form" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
        <label class="field">
          <span class="field-label">Your name</span>
          <input id="su-name" name="name" autocomplete="name" required enterkeyhint="next">
        </label>
        <label class="field">
          <span class="field-label">Username</span>
          <input id="su-user" name="username" autocomplete="username" required
                 autocapitalize="none" spellcheck="false" enterkeyhint="next">
          <span class="hint">3–32 characters: letters, digits, . _ or -</span>
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input id="su-pass" name="password" type="password" autocomplete="new-password"
                 required minlength="8" enterkeyhint="go">
          <span class="hint">At least 8 characters</span>
        </label>
        <button type="submit" class="go">Create student account</button>
      </form>

      <p id="msg" class="msg" role="status" aria-live="polite"></p>
    </div>

    <p class="foot">New accounts are student accounts. Admin access is granted by an administrator.</p>
  </main>

  <script src="/login.js"></script>
</body>
</html>
